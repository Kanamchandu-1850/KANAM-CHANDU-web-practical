<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 140</h1><p>Stopwatch</p></header>
<main>
  <div class="program-page">
    <h1>Stopwatch</h1>
    <p class="description">A start/stop/reset stopwatch measured in seconds.</p>
    <div class="output-box">
<div id="out140" class="output-line">0s</div><button class="btn" onclick="start140()">Start</button><button class="btn" onclick="stop140()">Stop</button><button class="btn" onclick="reset140()">Reset</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
let sec140=0, iv140;
function start140(){ clearInterval(iv140); iv140=setInterval(()=>{ sec140++; out140.textContent=sec140+"s"; },1000); }
function stop140(){ clearInterval(iv140); }
function reset140(){ clearInterval(iv140); sec140=0; out140.textContent="0s"; }
</script>
</body>
</html>
