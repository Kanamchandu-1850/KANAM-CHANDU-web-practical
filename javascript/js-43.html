<!DOCTYPE html>

<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }

<body>
<header class="site-header"><h1>JavaScript Program 43</h1><p>Classes and Objects</p></header>
<main>
  <div class="program-page">
    <h1>Classes and Objects</h1>
    <p class="description">Demonstrates an ES6 class with a constructor and method.</p>
    <div class="output-box">
<button class="btn" onclick="run43()">Run</button><div id="out43" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
class Car {
  constructor(brand){ this.brand = brand; }
  drive(){ return this.brand + " is driving."; }
}
function run43(){ const c = new Car("Toyota"); out43.textContent = c.drive(); }
</script>
