<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate a Phone Number Using a Regular Expression</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 124</h1><p>Validate a Phone Number Using a Regular Expression</p></header>
<main>
  <div class="program-page">
    <h1>Validate a Phone Number Using a Regular Expression</h1>
    <p class="description">Validates an Indian-style 10-digit mobile number starting 6-9.</p>
    <div class="output-box">
<input id="ph124" placeholder="9876543210"><button class="btn" onclick="run124()">Validate</button><div id="out124" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run124(){ out124.textContent = /^[6-9]\d{9}$/.test(ph124.value) ? "Valid mobile number" : "Invalid mobile number"; }
</script>
</body>
</html>
