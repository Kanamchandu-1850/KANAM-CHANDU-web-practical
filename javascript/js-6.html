<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factorial of a Number</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 6</h1><p>Factorial of a Number</p></header>
<main>
  <div class="program-page">
    <h1>Factorial of a Number</h1>
    <p class="description">Calculates factorial using a for loop.</p>
    <div class="output-box">
<input id="n6" type="number" value="5"><button class="btn" onclick="run6()">Calculate</button><div id="out6" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run6(){ let n=+n6.value, f=1; for(let i=2;i<=n;i++) f*=i; out6.textContent = `${n}! = ${f}`; }
</script>
</body>
</html>
