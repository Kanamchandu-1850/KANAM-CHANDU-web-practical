<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart Using localStorage</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 165</h1><p>Shopping Cart Using localStorage</p></header>
<main>
  <div class="program-page">
    <h1>Shopping Cart Using localStorage</h1>
    <p class="description">Adds items to a cart array stored in localStorage.</p>
    <div class="output-box">
<input id="item165" placeholder="Item name"><button class="btn" onclick="add165()">Add to Cart</button><ul id="cart165"></ul>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function getCart165(){ return JSON.parse(localStorage.getItem("cart165")||"[]"); }
function render165(){ cart165.innerHTML = getCart165().map(i=>`<li>${i}</li>`).join(""); }
function add165(){ if(!item165.value) return; const arr=getCart165(); arr.push(item165.value); localStorage.setItem("cart165", JSON.stringify(arr)); item165.value=""; render165(); }
render165();
</script>
</body>
</html>
