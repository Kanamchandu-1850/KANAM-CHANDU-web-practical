<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Application Using localStorage</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 164</h1><p>Notes Application Using localStorage</p></header>
<main>
  <div class="program-page">
    <h1>Notes Application Using localStorage</h1>
    <p class="description">Saves a free-text note that persists after refresh.</p>
    <div class="output-box">
<textarea id="note164" rows="4" placeholder="Write a note..."></textarea><button class="btn" onclick="save164()">Save Note</button><div id="out164" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
note164.value = localStorage.getItem("note164") || "";
function save164(){ localStorage.setItem("note164", note164.value); out164.textContent = "Note saved!"; }
</script>
</body>
</html>
