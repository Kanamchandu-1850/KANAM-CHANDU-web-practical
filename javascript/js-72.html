<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add, Edit, and Delete To-Do Items</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 72</h1><p>Add, Edit, and Delete To-Do Items</p></header>
<main>
  <div class="program-page">
    <h1>Add, Edit, and Delete To-Do Items</h1>
    <p class="description">Extends a to-do list with edit and delete controls per item.</p>
    <div class="output-box">
<input id="todoInput72" placeholder="New task..."><button class="btn" onclick="addTodo72()">Add</button><ul id="todoList72"></ul>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function addTodo72(){
  if(!todoInput72.value.trim()) return;
  const li=document.createElement("li");
  const span=document.createElement("span"); span.textContent=todoInput72.value;
  const editBtn=document.createElement("button"); editBtn.textContent="Edit"; editBtn.onclick=()=>{ const v=prompt("Edit task:", span.textContent); if(v) span.textContent=v; };
  const delBtn=document.createElement("button"); delBtn.textContent="Delete"; delBtn.onclick=()=>li.remove();
  li.append(span," ", editBtn," ", delBtn);
  todoList72.appendChild(li);
  todoInput72.value="";
}
</script>
</body>
</html>
