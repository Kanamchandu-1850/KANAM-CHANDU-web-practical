<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Array Methods</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 18</h1><p>Array Methods</p></header>
<main>
  <div class="program-page">
    <h1>Array Methods</h1>
    <p class="description">Demonstrates map, filter, and reduce.</p>
    <div class="output-box">
<input id="arr18" value="1,2,3,4,5,6"><button class="btn" onclick="run18()">Run</button><div id="out18" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run18(){
  const a = arr18.value.split(",").map(Number);
  const doubled = a.map(x=>x*2);
  const evens = a.filter(x=>x%2===0);
  const total = a.reduce((s,x)=>s+x,0);
  out18.textContent = `Doubled: ${doubled}\nEvens: ${evens}\nSum (reduce): ${total}`;
}
</script>
</body>
</html>
