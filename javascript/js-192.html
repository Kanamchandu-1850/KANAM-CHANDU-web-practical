<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Password Generator</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 192</h1><p>Random Password Generator</p></header>
<main>
  <div class="program-page">
    <h1>Random Password Generator</h1>
    <p class="description">Generates a random password from letters, numbers, and symbols.</p>
    <div class="output-box">
<input id="len192" type="number" value="12" style="width:60px;"><button class="btn" onclick="run192()">Generate</button><div id="out192" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run192(){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  let pwd=""; const len=+len192.value||12;
  for(let i=0;i<len;i++) pwd += chars[Math.floor(Math.random()*chars.length)];
  out192.textContent = pwd;
}
</script>
</body>
</html>
