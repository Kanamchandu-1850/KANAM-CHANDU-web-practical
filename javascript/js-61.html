<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Dropdown List</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 61</h1><p>Dynamic Dropdown List</p></header>
<main>
  <div class="program-page">
    <h1>Dynamic Dropdown List</h1>
    <p class="description">Populates a select dropdown's options using JavaScript.</p>
    <div class="output-box">
<select id="sel61"></select><button class="btn" onclick="run61()">Load Options</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run61(){ const opts=["Red","Green","Blue"]; sel61.innerHTML = opts.map(o=>`<option>${o}</option>`).join(""); }
</script>
</body>
</html>
