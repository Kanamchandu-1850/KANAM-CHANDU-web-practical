<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display API Data Dynamically</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 47</h1><p>Display API Data Dynamically</p></header>
<main>
  <div class="program-page">
    <h1>Display API Data Dynamically</h1>
    <p class="description">Fetches a list from an API and renders it as an HTML list.</p>
    <div class="output-box">
<button class="btn" onclick="run47()">Load Users</button><ul id="out47"></ul>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run47(){
  fetch("https://jsonplaceholder.typicode.com/users?_limit=5")
    .then(r=>r.json())
    .then(users=>{
      out47.innerHTML = users.map(u=>`<li>${u.name} (${u.email})</li>`).join("");
    })
    .catch(e=>{ out47.innerHTML = "<li>Failed to load (offline?)</li>"; });
}
</script>
</body>
</html>
