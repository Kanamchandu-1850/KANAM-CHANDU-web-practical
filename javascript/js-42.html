<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spread and Rest Operators</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 42</h1><p>Spread and Rest Operators</p></header>
<main>
  <div class="program-page">
    <h1>Spread and Rest Operators</h1>
    <p class="description">Demonstrates the spread operator (expanding) and rest parameter (collecting).</p>
    <div class="output-box">
<button class="btn" onclick="run42()">Run</button><div id="out42" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function sumAll(...nums){ return nums.reduce((a,b)=>a+b,0); }
function run42(){
  const arr1=[1,2,3], arr2=[...arr1,4,5];
  out42.textContent = `Spread: ${arr2}\nRest sum(1,2,3,4): ${sumAll(1,2,3,4)}`;
}
</script>
</body>
</html>
