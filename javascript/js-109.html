<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate Email Address</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 109</h1><p>Validate Email Address</p></header>
<main>
  <div class="program-page">
    <h1>Validate Email Address</h1>
    <p class="description">Checks an email field against a standard email pattern.</p>
    <div class="output-box">
<input id="em109" placeholder="you@example.com"><button class="btn" onclick="run109()">Validate</button><div id="out109" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run109(){ out109.textContent = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em109.value) ? "Valid email" : "Invalid email format"; }
</script>
</body>
</html>
