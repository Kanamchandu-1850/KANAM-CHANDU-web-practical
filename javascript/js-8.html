<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Prime Number</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 8</h1><p>Check Prime Number</p></header>
<main>
  <div class="program-page">
    <h1>Check Prime Number</h1>
    <p class="description">Checks whether a number is prime.</p>
    <div class="output-box">
<input id="n8" type="number" value="29"><button class="btn" onclick="run8()">Check</button><div id="out8" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run8(){
  let n=+n8.value, isPrime = n>1;
  for(let i=2;i*i<=n;i++){ if(n%i===0){ isPrime=false; break; } }
  out8.textContent = n + (isPrime?" is Prime":" is Not Prime");
}
</script>
</body>
</html>
