<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Capturing</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 97</h1><p>Event Capturing</p></header>
<main>
  <div class="program-page">
    <h1>Event Capturing</h1>
    <p class="description">Demonstrates capturing phase by setting the third addEventListener argument to true.</p>
    <div class="output-box">
<div class="nest-wrap">
  <div id="outer97" class="nest-outer alt">Outer
    <div id="inner97" class="nest-inner alt">Inner (click me)</div>
  </div>
</div>
<div id="out97" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
document.getElementById("outer97").addEventListener("click", ()=>{ out97.textContent += "\nOuter fired (capturing phase, runs FIRST)"; }, true);
document.getElementById("inner97").addEventListener("click", ()=>{ out97.textContent = "Inner fired"; });
</script>
</body>
</html>
