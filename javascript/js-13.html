<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort an Array</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 13</h1><p>Sort an Array</p></header>
<main>
  <div class="program-page">
    <h1>Sort an Array</h1>
    <p class="description">Sorts an array of numbers in ascending order.</p>
    <div class="output-box">
<input id="arr13" value="5,2,9,1,7"><button class="btn" onclick="run13()">Sort</button><div id="out13" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run13(){ const a=arr13.value.split(",").map(Number).sort((x,y)=>x-y); out13.textContent = a.join(", "); }
</script>
</body>
</html>
