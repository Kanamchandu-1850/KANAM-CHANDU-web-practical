<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Coordinate Tracker</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 100</h1><p>Mouse Coordinate Tracker</p></header>
<main>
  <div class="program-page">
    <h1>Mouse Coordinate Tracker</h1>
    <p class="description">Displays the mouse's X/Y position anywhere on the page.</p>
    <div class="output-box">
<div id="out100" class="output-line">Move your mouse...</div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
document.addEventListener("mousemove", e=>{ out100.textContent = `X: ${e.clientX}, Y: ${e.clientY}`; });
</script>
</body>
</html>
