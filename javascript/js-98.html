<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Delegation</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 98</h1><p>Event Delegation</p></header>
<main>
  <div class="program-page">
    <h1>Event Delegation</h1>
    <p class="description">Handles clicks on many list items using one listener on their shared parent.</p>
    <div class="output-box">
<ul id="list98"><li>Item 1</li><li>Item 2</li><li>Item 3</li></ul><div id="out98" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
list98.addEventListener("click", e=>{ if(e.target.tagName==="LI") out98.textContent = "You clicked: " + e.target.textContent; });
</script>
</body>
</html>
