<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Palindrome String</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 35</h1><p>Check Palindrome String</p></header>
<main>
  <div class="program-page">
    <h1>Check Palindrome String</h1>
    <p class="description">Checks if a string reads the same forwards and backwards.</p>
    <div class="output-box">
<input id="s35" value="madam"><button class="btn" onclick="run35()">Check</button><div id="out35" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run35(){ const s=s35.value.toLowerCase(); const r=s.split("").reverse().join(""); out35.textContent = s + (s===r ? " is a palindrome" : " is not a palindrome"); }
</script>
</body>
</html>
