<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create and Remove CSS Classes Dynamically</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 55</h1><p>Create and Remove CSS Classes Dynamically</p></header>
<main>
  <div class="program-page">
    <h1>Create and Remove CSS Classes Dynamically</h1>
    <p class="description">Adds and removes a CSS class using classList.add/remove.</p>
    <div class="output-box">
<p id="cls55">Toggle my class</p><button class="btn" onclick="add55()">Add Class</button><button class="btn" onclick="rem55()">Remove Class</button><style>.highlighted{background:#fef9c3; padding:6px;}</style>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function add55(){ cls55.classList.add("highlighted"); } function rem55(){ cls55.classList.remove("highlighted"); }
</script>
</body>
</html>
