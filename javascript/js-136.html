<!DOCTYPE html>

<head>

<style>

<body>
<header class="site-header"><h1>JavaScript Program 136</h1><p>setTimeout()</p></header>
<main>
  <div class="program-page">
    <h1>setTimeout()</h1>
    <p class="description">Runs a function once after a specified delay.</p>
    <div class="output-box">
<button class="btn" onclick="run136()">Start 2s Timer</button><div id="out136" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run136(){ out136.textContent="Waiting..."; setTimeout(()=>{ out136.textContent="2 seconds passed!"; }, 2000); }
</script>
