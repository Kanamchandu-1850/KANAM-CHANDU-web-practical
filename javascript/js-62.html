<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dependent Dropdown: Country → State → City</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 62</h1><p>Dependent Dropdown: Country → State → City</p></header>
<main>
  <div class="program-page">
    <h1>Dependent Dropdown: Country → State → City</h1>
    <p class="description">Populates a second dropdown based on the first dropdown's selection.</p>
    <div class="output-box">
<select id="country62"><option value="">Select Country</option><option value="india">India</option><option value="usa">USA</option></select><select id="state62"><option>Select State</option></select>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
const data62 = { india:["Tamil Nadu","Kerala","Karnataka"], usa:["California","Texas","New York"] };
country62.addEventListener("change", function(){
  const states = data62[this.value] || [];
  state62.innerHTML = "<option>Select State</option>" + states.map(s=>`<option>${s}</option>`).join("");
});
</script>
</body>
</html>
