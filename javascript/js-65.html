<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Show/Hide Content Button</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 65</h1><p>Show/Hide Content Button</p></header>
<main>
  <div class="program-page">
    <h1>Show/Hide Content Button</h1>
    <p class="description">Toggles the visibility of a content block with a single button.</p>
    <div class="output-box">
<button class="btn" onclick="run65()">Toggle Content</button><p id="content65" style="display:none; margin-top:10px;">This content was hidden!</p>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run65(){ content65.style.display = content65.style.display==="none" ? "block" : "none"; }
</script>
</body>
</html>
