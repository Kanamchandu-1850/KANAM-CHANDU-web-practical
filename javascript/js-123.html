<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate an Email Using a Regular Expression</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 123</h1><p>Validate an Email Using a Regular Expression</p></header>
<main>
  <div class="program-page">
    <h1>Validate an Email Using a Regular Expression</h1>
    <p class="description">A dedicated regex-based email validator (duplicate check for forms unit).</p>
    <div class="output-box">
<input id="em123" placeholder="you@example.com"><button class="btn" onclick="run123()">Validate</button><div id="out123" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run123(){ out123.textContent = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(em123.value) ? "Valid" : "Invalid"; }
</script>
</body>
</html>
