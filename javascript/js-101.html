<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Counter</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 101</h1><p>Click Counter</p></header>
<main>
  <div class="program-page">
    <h1>Click Counter</h1>
    <p class="description">Counts how many times a button has been clicked.</p>
    <div class="output-box">
<button class="btn" onclick="run101()">Click Me</button><div id="out101" class="output-line">Clicks: 0</div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
let n101=0; function run101(){ n101++; out101.textContent = "Clicks: " + n101; }
</script>
</body>
</html>
