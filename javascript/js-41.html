<body>
<header class="site-header"><h1>JavaScript Program 41</h1><p>ES6: let, const, Template Literals & Destructuring</p></header>
<main>
  <div class="program-page">
    <h1>ES6: let, const, Template Literals & Destructuring</h1>
    <p class="description">Demonstrates block-scoped variables, template strings, and array/object destructuring.</p>
    <div class="output-box">
<button class="btn" onclick="run41()">Run</button><div id="out41" class="output-line"></div>
    </div>

<script>
function run41(){
  let x = 10; const y = 20;
  const [p,q] = [1,2];
  const {name, age} = {name:"Priya", age:22};
  out41.textContent = `x+y=${x+y}\ndestructured array: p=${p}, q=${q}\ndestructured object: ${name}, ${age}`;
}
</script>
