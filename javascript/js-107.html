<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate Age Field</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 107</h1><p>Validate Age Field</p></header>
<main>
  <div class="program-page">
    <h1>Validate Age Field</h1>
    <p class="description">Checks that age is a number within a reasonable range.</p>
    <div class="output-box">
<input id="age107" type="number" placeholder="Enter age"><button class="btn" onclick="run107()">Validate</button><div id="out107" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run107(){ const a=+age107.value; out107.textContent = (a>=1 && a<=120) ? "Valid age" : "Enter an age between 1 and 120"; }
</script>
</body>
</html>
