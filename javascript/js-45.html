<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callbacks, Promises & Async/Await</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 45</h1><p>Callbacks, Promises & Async/Await</p></header>
<main>
  <div class="program-page">
    <h1>Callbacks, Promises & Async/Await</h1>
    <p class="description">Demonstrates all three asynchronous patterns with a simulated delay.</p>
    <div class="output-box">
<button class="btn" onclick="run45()">Run</button><div id="out45" class="output-line">Click Run and wait 1s...</div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function delay(cb){ setTimeout(()=>cb("Done via callback"), 500); }
function delayPromise(){ return new Promise(res=>setTimeout(()=>res("Done via promise"), 500)); }
async function run45(){
  delay(msg=>{ out45.textContent = msg; });
  const p = await delayPromise();
  setTimeout(()=>{ out45.textContent += "\n" + p; }, 600);
}
</script>
</body>
</html>
