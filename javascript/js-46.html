<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fetch Data from an API</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 46</h1><p>Fetch Data from an API</p></header>
<main>
  <div class="program-page">
    <h1>Fetch Data from an API</h1>
    <p class="description">Uses the Fetch API to retrieve data from a public endpoint.</p>
    <div class="output-box">
<button class="btn" onclick="run46()">Fetch Data</button><div id="out46" class="output-line">Click to fetch...</div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run46(){
  out46.textContent = "Loading...";
  fetch("https://jsonplaceholder.typicode.com/todos/1")
    .then(r=>r.json())
    .then(data=>{ out46.textContent = JSON.stringify(data, null, 2); })
    .catch(e=>{ out46.textContent = "Fetch failed (offline?): " + e; });
}
</script>
</body>
</html>
