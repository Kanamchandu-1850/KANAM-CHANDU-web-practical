<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Show/Hide Feature</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 60</h1><p>Password Show/Hide Feature</p></header>
<main>
  <div class="program-page">
    <h1>Password Show/Hide Feature</h1>
    <p class="description">Toggles a password field between hidden and visible text.</p>
    <div class="output-box">
<input type="password" id="pwd60" value="secret123"><button class="btn" onclick="run60()">Show/Hide</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run60(){ pwd60.type = pwd60.type==="password" ? "text" : "password"; }
</script>
</body>
</html>
