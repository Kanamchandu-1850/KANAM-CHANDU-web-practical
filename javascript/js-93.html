<!DOCTYPE html>

<body>
<header class="site-header"><h1>JavaScript Program 93</h1><p>addEventListener()</p></header>
<main>
  <div class="program-page">
    <h1>addEventListener()</h1>
    <p class="description">Attaches an event handler using addEventListener instead of inline attributes.</p>
    <div class="output-box">
<button class="btn" id="btn93">Click Me</button><div id="out93" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
document.getElementById("btn93").addEventListener("click", ()=>{ out93.textContent = "Clicked via addEventListener!"; });
</script>
</body>
