<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The input Event</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 90</h1><p>The input Event</p></header>
<main>
  <div class="program-page">
    <h1>The input Event</h1>
    <p class="description">Fires continuously as the user types in a field.</p>
    <div class="output-box">
<input id="in90" placeholder="Type here"><div id="out90" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
in90.addEventListener("input", ()=>{ out90.textContent = "Current value: " + in90.value; });
</script>
</body>
</html>
