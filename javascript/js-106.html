<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate Name Field (Alphabets Only)</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 106</h1><p>Validate Name Field (Alphabets Only)</p></header>
<main>
  <div class="program-page">
    <h1>Validate Name Field (Alphabets Only)</h1>
    <p class="description">Ensures a name field contains only letters and spaces.</p>
    <div class="output-box">
<input id="n106" placeholder="Enter name"><button class="btn" onclick="run106()">Validate</button><div id="out106" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run106(){ out106.textContent = /^[A-Za-z\s]+$/.test(n106.value) ? "Valid name" : "Name must contain only letters"; }
</script>
</body>
</html>
