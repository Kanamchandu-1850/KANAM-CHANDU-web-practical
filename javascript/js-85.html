<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Events: keyup</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 85</h1><p>Keyboard Events: keyup</p></header>
<main>
  <div class="program-page">
    <h1>Keyboard Events: keyup</h1>
    <p class="description">Displays which key was released.</p>
    <div class="output-box">
<input id="in85" placeholder="Press any key"><div id="out85" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
in85.addEventListener("keyup", e=>{ out85.textContent = "Key up: " + e.key; });
</script>
</body>
</html>
