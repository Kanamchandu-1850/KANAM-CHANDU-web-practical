<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New Elements Dynamically</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 49</h1><p>Add New Elements Dynamically</p></header>
<main>
  <div class="program-page">
    <h1>Add New Elements Dynamically</h1>
    <p class="description">Adds a new list item to the page using createElement and appendChild.</p>
    <div class="output-box">
<ul id="list49"><li>Item 1</li></ul><button class="btn" onclick="run49()">Add Item</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
let count49=1; function run49(){ count49++; const li=document.createElement("li"); li.textContent="Item "+count49; list49.appendChild(li); }
</script>
</body>
</html>
