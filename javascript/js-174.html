<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Form Data Automatically Using localStorage</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 174</h1><p>Save Form Data Automatically Using localStorage</p></header>
<main>
  <div class="program-page">
    <h1>Save Form Data Automatically Using localStorage</h1>
    <p class="description">Auto-saves an input's value on every keystroke.</p>
    <div class="output-box">
<input id="auto174" placeholder="Auto-saving input..." oninput="localStorage.setItem('autoSave174', this.value)">
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
auto174.value = localStorage.getItem("autoSave174") || "";
</script>
</body>
</html>
