<!DOCTYPE html>

<title>Display Current Date and Time Dynamically</title>

<body>
<header class="site-header"><h1>JavaScript Program 70</h1><p>Display Current Date and Time Dynamically</p></header>
<main>
  <div class="program-page">
    <h1>Display Current Date and Time Dynamically</h1>
    <p class="description">Updates the displayed date/time live every second.</p>
    <div class="output-box">
<div id="clock70" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function tick70(){ clock70.textContent = new Date().toLocaleString(); } tick70(); setInterval(tick70, 1000);
</script>
