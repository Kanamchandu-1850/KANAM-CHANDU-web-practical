<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate Dropdown/Select Box</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 116</h1><p>Validate Dropdown/Select Box</p></header>
<main>
  <div class="program-page">
    <h1>Validate Dropdown/Select Box</h1>
    <p class="description">Ensures a select box has a non-default value chosen.</p>
    <div class="output-box">
<select id="sel116"><option value="">Select course</option><option>BCA</option><option>B.Sc</option></select><button class="btn" onclick="run116()">Validate</button><div id="out116" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run116(){ out116.textContent = sel116.value ? "Selected: "+sel116.value : "Please select a course"; }
</script>
</body>
</html>
