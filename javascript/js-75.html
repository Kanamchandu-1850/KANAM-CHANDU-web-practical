<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a Dynamic Unordered List from an Array</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 75</h1><p>Create a Dynamic Unordered List from an Array</p></header>
<main>
  <div class="program-page">
    <h1>Create a Dynamic Unordered List from an Array</h1>
    <p class="description">Builds a &lt;ul&gt; directly from a JavaScript array.</p>
    <div class="output-box">
<div id="wrap75"></div><button class="btn" onclick="run75()">Build List</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run75(){ const fruits=["Apple","Banana","Mango"]; wrap75.innerHTML = "<ul>" + fruits.map(f=>`<li>${f}</li>`).join("") + "</ul>"; }
</script>
</body>
</html>
