<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 186</h1><p>Number Guessing Game</p></header>
<main>
  <div class="program-page">
    <h1>Number Guessing Game</h1>
    <p class="description">The computer picks a random number 1-100 and the player guesses it.</p>
    <div class="output-box">
<input id="guess186" type="number" placeholder="Guess 1-100"><button class="btn" onclick="run186()">Guess</button><div id="out186" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
let target186 = Math.floor(Math.random()*100)+1;
function run186(){
  const g=+guess186.value;
  if(g===target186){ out186.textContent="🎉 Correct! The number was "+target186; target186=Math.floor(Math.random()*100)+1; }
  else if(g<target186) out186.textContent="Too low, try again.";
  else out186.textContent="Too high, try again.";
}
</script>
</body>
</html>
