<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onmousemove Event</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 83</h1><p>onmousemove Event</p></header>
<main>
  <div class="program-page">
    <h1>onmousemove Event</h1>
    <p class="description">Tracks and displays the mouse position within a box.</p>
    <div class="output-box">
<div id="box83" style="height:120px; background:#f3f4f6; border:1px solid #d1d5db;"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
box83.addEventListener("mousemove", e=>{ const r=box83.getBoundingClientRect(); box83.textContent = `X: ${e.clientX-r.left}, Y: ${e.clientY-r.top}`; });
</script>
</body>
</html>
