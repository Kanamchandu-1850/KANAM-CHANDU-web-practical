<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The reset Event</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 92</h1><p>The reset Event</p></header>
<main>
  <div class="program-page">
    <h1>The reset Event</h1>
    <p class="description">Detects when a form is reset.</p>
    <div class="output-box">
<form id="form92"><input placeholder="Type something"><button class="btn" type="reset">Reset</button></form><div id="out92" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
form92.addEventListener("reset", ()=>{ out92.textContent = "Form was reset."; });
</script>
</body>
</html>
