<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate Date of Birth Field</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 113</h1><p>Validate Date of Birth Field</p></header>
<main>
  <div class="program-page">
    <h1>Validate Date of Birth Field</h1>
    <p class="description">Ensures a selected date of birth is not in the future.</p>
    <div class="output-box">
<input id="dob113" type="date"><button class="btn" onclick="run113()">Validate</button><div id="out113" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run113(){ const d=new Date(dob113.value); out113.textContent = (dob113.value && d<=new Date()) ? "Valid date of birth" : "Please enter a valid past date"; }
</script>
</body>
</html>
