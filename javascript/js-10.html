<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse a Number</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .output-line { background:#f3f4f6; border-radius:6px; padding:10px 14px; margin-top:10px; font-family:monospace; white-space:pre-wrap; }
  
</style>
</head>
<body>
<header class="site-header"><h1>JavaScript Program 10</h1><p>Reverse a Number</p></header>
<main>
  <div class="program-page">
    <h1>Reverse a Number</h1>
    <p class="description">Reverses the digits of a number.</p>
    <div class="output-box">
<input id="n10" type="number" value="12345"><button class="btn" onclick="run10()">Reverse</button><div id="out10" class="output-line"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to JavaScript Programs</a></div>
  </div>
</main>
<script>
function run10(){ out10.textContent = "Reversed: " + n10.value.split("").reverse().join(""); }
</script>
</body>
</html>
