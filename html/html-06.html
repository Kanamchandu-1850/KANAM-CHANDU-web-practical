<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio and Video Elements</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="site-header">
  <h1>Program 6</h1>
  <p>Audio and Video Elements</p>
</header>
<main>
  <div class="program-page">
    <h1>Audio &amp; Video</h1>
    <p class="description">Demonstrates the HTML5 &lt;audio&gt; and &lt;video&gt; tags with native browser controls.</p>

    <div class="output-box">
      <h3>Audio Player</h3>
      <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>

      <h3>Video Player</h3>
      <video width="360" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video element.
      </video>
      <p><em>Note: sample media URLs are used here — replace with your own files for offline use.</em></p>
    </div>

    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="index.html">Back to HTML Programs</a>
    </div>
  </div>
</main>
</body>
</html>
