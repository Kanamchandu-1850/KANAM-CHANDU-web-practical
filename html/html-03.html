<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables with Rows, Columns &amp; Merged Cells</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="site-header">
  <h1>Program 3</h1>
  <p>Tables — Rows, Columns, Borders &amp; Merged Cells</p>
</header>
<main>
  <div class="program-page">
    <h1>HTML Table</h1>
    <p class="description">Demonstrates a table with rows, columns, borders, and cells merged using rowspan and colspan.</p>

    <div class="output-box">
      <table class="demo-table" border="1">
        <tr>
          <th colspan="3">Student Marks Report</th>
        </tr>
        <tr>
          <th>Name</th>
          <th>Subject</th>
          <th>Marks</th>
        </tr>
        <tr>
          <td rowspan="2">Arun</td>
          <td>Maths</td>
          <td>88</td>
        </tr>
        <tr>
          <td>Science</td>
          <td>91</td>
        </tr>
        <tr>
          <td rowspan="2">Priya</td>
          <td>Maths</td>
          <td>95</td>
        </tr>
        <tr>
          <td>Science</td>
          <td>89</td>
        </tr>
      </table>
    </div>

    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="index.html">Back to HTML Programs</a>
    </div>
  </div>
</main>
</body>
</html>
