<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error-state Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .state-box { text-align:center; padding:40px 20px; color:#6b7280; }
  .state-box.error .icon { color:#dc2626; font-size:40px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 74</h1><p>Error-state Component</p></header>
<main>
  <div class="program-page">
    <h1>Error State</h1>
    <p class="description">Shown when something fails to load, with a clear message and a retry action.</p>
    <div class="output-box state-box error">
      <div class="icon">⚠️</div>
      <h3>Something went wrong</h3>
      <p>We couldn't load your data. Please try again.</p>
      <button class="btn" style="background:#dc2626;">Retry</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
