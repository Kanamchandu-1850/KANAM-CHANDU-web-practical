<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot-password Form</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .form-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:26px; max-width:340px; }
  .form-card h2 { margin-top:0; text-align:center; }
  .form-card label { font-weight:600; display:block; margin:10px 0 4px; font-size:0.9rem; }
  .form-card input { width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:6px; }
  .form-card .btn { width:100%; margin-top:16px; }
  .form-card .link { text-align:center; margin-top:12px; font-size:0.85rem; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 83</h1><p>Forgot-password Form</p></header>
<main>
  <div class="program-page">
    <h1>Forgot Password</h1>
    <p class="description">Lets a user request a password reset link by entering their email.</p>
    <div class="output-box">
      <div class="form-card">
        <h2>Reset Password</h2>
        <p style="color:#6b7280; font-size:0.85rem; text-align:center;">Enter your email and we'll send you a reset link.</p>
        <label>Email</label><input type="email" placeholder="you@example.com">
        <button class="btn">Send Reset Link</button>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
