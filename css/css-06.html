<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Styles</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .b1 { border: 3px solid #2563eb; padding:10px; margin-bottom:10px; }
  .b2 { border: 4px dashed #16a34a; padding:10px; margin-bottom:10px; }
  .b3 { border: 4px dotted #dc2626; padding:10px; margin-bottom:10px; }
  .b4 { border: 4px double #7c3aed; padding:10px; margin-bottom:10px; }
  .b5 { border: 3px solid #f59e0b; border-radius: 20px; padding:10px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 6</h1><p>Border Styles, Widths, Colors &amp; Border-radius</p></header>
<main>
  <div class="program-page">
    <h1>Border Variations</h1>
    <p class="description">Demonstrates solid, dashed, dotted, and double borders, plus border-radius.</p>
    <div class="output-box">
      <div class="b1">Solid border</div>
      <div class="b2">Dashed border</div>
      <div class="b3">Dotted border</div>
      <div class="b4">Double border</div>
      <div class="b5">Rounded border (border-radius)</div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
