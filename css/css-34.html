<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Keyframe Animations</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
  }
  @keyframes colorShift {
    0% { background-color:#6366f1; }
    50% { background-color:#f59e0b; }
    100% { background-color:#16a34a; }
  }
  .bounce-box {
    width:70px; height:70px; border-radius:50%;
    animation: bounce 1.2s infinite ease-in-out, colorShift 3s infinite;
  }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 34</h1><p>CSS Keyframe Animations</p></header>
<main>
  <div class="program-page">
    <h1>@keyframes Animation</h1>
    <p class="description">A ball bounces continuously while its color shifts through a keyframe animation loop.</p>
    <div class="output-box">
      <div class="bounce-box"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
