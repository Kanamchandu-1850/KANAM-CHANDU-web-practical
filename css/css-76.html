<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading-state Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .state-box { text-align:center; padding:40px 20px; color:#6b7280; }
  .spin { width:40px; height:40px; border:5px solid #e5e7eb; border-top:5px solid #6366f1; border-radius:50%; margin:0 auto 12px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 76</h1><p>Loading-state Component</p></header>
<main>
  <div class="program-page">
    <h1>Loading State</h1>
    <p class="description">Shown while data is being fetched, reassuring the user that the app is working.</p>
    <div class="output-box state-box">
      <div class="spin"></div>
      <p>Loading your dashboard...</p>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
