      </div>
      <div style="display:flex; align-items:flex-end; gap:8px; height:100px; background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:14px;">
        <div style="width:20px; height:40%; background:#7c3aed; border-radius:4px 4px 0 0;"></div>
