<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Navigation</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .tabs input[type="radio"] { display:none; }
  .tab-labels { display:flex; border-bottom:2px solid #e5e7eb; }
  .tab-labels label { padding:10px 18px; cursor:pointer; color:#6b7280; }
  #tab1:checked ~ .tab-labels label[for="tab1"],
  #tab2:checked ~ .tab-labels label[for="tab2"],
  #tab3:checked ~ .tab-labels label[for="tab3"] { color:#6366f1; border-bottom:2px solid #6366f1; }
  .tab-panels div { display:none; padding:16px 4px; }
  #tab1:checked ~ .tab-panels .p1,
  #tab2:checked ~ .tab-panels .p2,
  #tab3:checked ~ .tab-panels .p3 { display:block; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 43</h1><p>Tab Navigation Component</p></header>
<main>
  <div class="program-page">
    <h1>CSS-only Tabs</h1>
    <p class="description">Radio buttons + the :checked selector switch between panels without any JavaScript.</p>
    <div class="output-box tabs">
      <input type="radio" name="tabs" id="tab1" checked>
      <input type="radio" name="tabs" id="tab2">
      <input type="radio" name="tabs" id="tab3">
      <div class="tab-labels">
        <label for="tab1">Overview</label>
        <label for="tab2">Pricing</label>
        <label for="tab3">FAQ</label>
      </div>
      <div class="tab-panels">
        <div class="p1">Overview panel content.</div>
        <div class="p2">Pricing panel content.</div>
        <div class="p3">FAQ panel content.</div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
