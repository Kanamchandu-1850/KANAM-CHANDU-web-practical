<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Statistics Card</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .stat-card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:18px; text-align:center; }
  .stat-card .num { font-size:1.8rem; font-weight:700; color:#6366f1; }
  .stat-card .label { color:#6b7280; font-size:0.9rem; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 51</h1><p>SaaS Statistics Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Statistics Cards</h1>
    <p class="description">Simple stat cards used to highlight key numbers on a marketing or admin page.</p>
    <div class="output-box stats-grid">
      <div class="stat-card"><div class="num">12,480</div><div class="label">Active Users</div></div>
      <div class="stat-card"><div class="num">98.7%</div><div class="label">Uptime</div></div>
      <div class="stat-card"><div class="num">$45K</div><div class="label">MRR</div></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
