<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Loading Spinner</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .spinner {
    width: 50px; height: 50px;
    border: 6px solid #e5e7eb;
    border-top: 6px solid #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dots { display:flex; gap:8px; margin-top:20px; }
  .dots span {
    width:14px; height:14px; background:#f59e0b; border-radius:50%;
    animation: pulse 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100% { opacity:0.3; transform:scale(0.8);} 50% { opacity:1; transform:scale(1.2);} }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 35</h1><p>CSS Loading Spinner and Loading Animation</p></header>
<main>
  <div class="program-page">
    <h1>Loading Indicators</h1>
    <p class="description">A pure-CSS rotating spinner and a pulsing three-dot loader, both built with @keyframes.</p>
    <div class="output-box">
      <div class="spinner"></div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
