<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Gradients</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .grad1 { height:100px; background: linear-gradient(90deg, #6366f1, #ec4899); border-radius:8px; margin-bottom:12px; }
  .grad2 { height:100px; background: linear-gradient(135deg, #22c55e, #06b6d4, #6366f1); border-radius:8px; margin-bottom:12px; }
  .grad3 { height:100px; background: radial-gradient(circle, #fde047, #f97316); border-radius:8px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 7</h1><p>Linear and Radial Gradients</p></header>
<main>
  <div class="program-page">
    <h1>CSS Gradients</h1>
    <p class="description">Shows a two-color linear gradient, a multi-color diagonal linear gradient, and a radial gradient.</p>
    <div class="output-box">
      <div class="grad1"></div>
      <div class="grad2"></div>
      <div class="grad3"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
