<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Card Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .notif-card { display:flex; gap:10px; background:#fff; border:1px solid #e5e7eb; border-left:4px solid #6366f1; border-radius:8px; padding:12px 16px; max-width:320px; }
  .notif-card .icon { font-size:20px; }
  .notif-card .time { color:#9ca3af; font-size:0.8rem; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 54</h1><p>Notification Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Notification Card</h1>
    <p class="description">A single notification item, as seen in a notification dropdown or feed.</p>
    <div class="output-box">
      <div class="notif-card">
        <div class="icon">🔔</div>
        <div>
          <div><strong>New comment</strong> on your report.</div>
          <div class="time">5 minutes ago</div>
        </div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
