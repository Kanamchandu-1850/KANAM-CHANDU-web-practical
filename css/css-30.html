<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Filters</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .filter-demo { display:flex; gap:12px; flex-wrap:wrap; }
  .filter-demo img { width:140px; height:140px; border-radius:8px; }
  .f-blur { filter: blur(3px); }
  .f-gray { filter: grayscale(100%); }
  .f-bright { filter: brightness(1.6); }
  .f-contrast { filter: contrast(2); }
  .f-opacity { filter: opacity(40%); }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 30</h1><p>CSS Filters: Blur, Grayscale, Brightness, Contrast &amp; Opacity</p></header>
<main>
  <div class="program-page">
    <h1>CSS Filter Effects</h1>
    <p class="description">The filter property applies visual effects, commonly used for image galleries and hover effects.</p>
    <div class="output-box filter-demo">
      <div><img class="f-blur" src="https://placehold.co/140" alt="blur"><p>blur</p></div>
      <div><img class="f-gray" src="https://placehold.co/140" alt="grayscale"><p>grayscale</p></div>
      <div><img class="f-bright" src="https://placehold.co/140" alt="brightness"><p>brightness</p></div>
      <div><img class="f-contrast" src="https://placehold.co/140" alt="contrast"><p>contrast</p></div>
      <div><img class="f-opacity" src="https://placehold.co/140" alt="opacity filter"><p>opacity</p></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
