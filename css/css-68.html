<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal and Dialog Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .modal-toggle { display:none; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10; }
  .modal-toggle:checked ~ .modal-overlay { display:flex; }
  .modal-box { background:#fff; padding:24px; border-radius:12px; width:300px; }
  .modal-box .close-btn { float:right; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 68</h1><p>Modal and Dialog Component</p></header>
<main>
  <div class="program-page">
    <h1>Modal Dialog</h1>
    <p class="description">A centered overlay dialog box, toggled here with a checkbox so it works without JavaScript.</p>
    <div class="output-box">
      <input type="checkbox" id="modalToggle" class="modal-toggle">
      <label for="modalToggle" class="btn">Open Modal</label>
      <div class="modal-overlay">
        <div class="modal-box">
          <label for="modalToggle" class="close-btn">✕</label>
          <h3>Confirm Action</h3>
          <p>Are you sure you want to proceed?</p>
          <label for="modalToggle" class="btn">OK</label>
        </div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
