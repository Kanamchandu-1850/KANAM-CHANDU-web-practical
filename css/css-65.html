<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast Notification Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .toast { position:relative; max-width:320px; background:#1f2937; color:#fff; padding:14px 18px; border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,0.25); display:flex; justify-content:space-between; align-items:center; }
  .toast button { background:none; border:none; color:#fff; cursor:pointer; font-size:16px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 65</h1><p>Toast Notification Component</p></header>
<main>
  <div class="program-page">
    <h1>Toast Notification</h1>
    <p class="description">A small floating notification that appears temporarily, usually in a screen corner, and can be dismissed.</p>
    <div class="output-box">
      <div class="toast">
        <span>✔ File uploaded successfully</span>
        <button>✕</button>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
