<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Variables</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  :root {
    --main-color: #6366f1;
    --pad: 16px;
    --radius: 10px;
  }
  .var-box {
    background: var(--main-color);
    color: #fff;
    padding: var(--pad);
    border-radius: var(--radius);
  }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 18</h1><p>CSS Variables and Custom Properties</p></header>
<main>
  <div class="program-page">
    <h1>Custom Properties</h1>
    <p class="description">Variables are declared once on :root using <code>--name</code> and reused anywhere with <code>var(--name)</code>, making themes easy to change.</p>
    <div class="output-box">
      <div class="var-box">This box's color, padding, and radius all come from CSS variables.</div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
