<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .product-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; max-width:240px; }
  .product-card img { width:100%; display:block; }
  .product-card .body { padding:14px; }
  .product-card .price { color:#6366f1; font-weight:700; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 48</h1><p>Product Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Product Card</h1>
    <p class="description">An e-commerce style product card with an image, title, price, and buy button.</p>
    <div class="output-box">
      <div class="product-card">
        <img src="https://placehold.co/240x150" alt="product">
        <div class="body">
          <h3 style="margin:0 0 6px;">Wireless Headphones</h3>
          <div class="price">$79.99</div>
          <button class="btn" style="margin-top:10px; width:100%;">Add to Cart</button>
        </div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
