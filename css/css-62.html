<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Avatars and Avatar Groups</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .avatar { width:44px; height:44px; border-radius:50%; }
  .avatar-group { display:flex; }
  .avatar-group .avatar { border:2px solid #fff; margin-left:-12px; }
  .avatar-group .avatar:first-child { margin-left:0; }
  .avatar-initials { width:44px; height:44px; border-radius:50%; background:#6366f1; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 62</h1><p>User Avatars and Avatar Groups</p></header>
<main>
  <div class="program-page">
    <h1>Avatars</h1>
    <p class="description">Single avatars (photo or initials) and an overlapping avatar group for showing multiple collaborators.</p>
    <div class="output-box">
      <img class="avatar" src="https://placehold.co/44x44" alt="user"><br><br>
      <div class="avatar-initials">AS</div><br><br>
      <div class="avatar-group">
        <img class="avatar" src="https://placehold.co/44x44/6366f1/fff?text=A">
        <img class="avatar" src="https://placehold.co/44x44/16a34a/fff?text=B">
        <img class="avatar" src="https://placehold.co/44x44/dc2626/fff?text=C">
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
