<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Card Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .pricing-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:24px; max-width:240px; text-align:center; }
  .pricing-card.featured { border-color:#6366f1; box-shadow:0 8px 20px rgba(99,102,241,0.2); }
  .pricing-card .amount { font-size:2rem; font-weight:700; margin:10px 0; }
  .pricing-card ul { list-style:none; padding:0; text-align:left; color:#6b7280; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 50</h1><p>Pricing Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Pricing Card</h1>
    <p class="description">A subscription plan card with price, feature list, and call-to-action.</p>
    <div class="output-box">
      <div class="pricing-card featured">
        <h3>Pro Plan</h3>
        <div class="amount">$29<span style="font-size:1rem;">/mo</span></div>
        <ul><li>✔ 10 Projects</li><li>✔ Priority Support</li><li>✔ Advanced Analytics</li></ul>
        <button class="btn" style="width:100%;">Choose Plan</button>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
