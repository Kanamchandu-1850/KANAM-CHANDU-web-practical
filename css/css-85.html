<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form (Styled)</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .form-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:26px; max-width:360px; }
  .form-card label { font-weight:600; display:block; margin:10px 0 4px; font-size:0.9rem; }
  .form-card input, .form-card select { width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:6px; }
  .form-card .btn { width:100%; margin-top:16px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 85</h1><p>Registration Form (Fully Styled)</p></header>
<main>
  <div class="program-page">
    <h1>Registration Form</h1>
    <p class="description">A more complete registration form styled with CSS, including a select field.</p>
    <div class="output-box">
      <div class="form-card">
        <h2 style="text-align:center; margin-top:0;">Register</h2>
        <label>Full Name</label><input type="text">
        <label>Email</label><input type="email">
        <label>Country</label>
        <select><option>India</option><option>USA</option><option>UK</option></select>
        <label>Password</label><input type="password">
        <button class="btn">Create Account</button>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
