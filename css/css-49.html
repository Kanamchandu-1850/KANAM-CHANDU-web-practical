<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Card Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .feature-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .feature-card { background:#f8fafc; border-radius:10px; padding:18px; text-align:center; }
  .feature-card .icon { font-size:26px; margin-bottom:6px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 49</h1><p>Feature Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Feature Cards</h1>
    <p class="description">A row of small cards highlighting key product features — common on SaaS landing pages.</p>
    <div class="output-box feature-grid">
      <div class="feature-card"><div class="icon">⚡</div><h4>Fast</h4><p>Sub-second response times.</p></div>
      <div class="feature-card"><div class="icon">🔒</div><h4>Secure</h4><p>End-to-end encryption.</p></div>
      <div class="feature-card"><div class="icon">📈</div><h4>Scalable</h4><p>Grows with your team.</p></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
