<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Stepper Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .stepper { display:flex; align-items:center; }
  .step { display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
  .step .circle { width:30px; height:30px; border-radius:50%; background:#e5e7eb; color:#6b7280; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .step.done .circle { background:#16a34a; color:#fff; }
  .step.active .circle { background:#6366f1; color:#fff; }
  .step:not(:last-child)::after { content:""; position:absolute; top:15px; left:60%; width:80%; height:2px; background:#e5e7eb; }
  .step.done:not(:last-child)::after { background:#16a34a; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 79</h1><p>Progress Stepper Component</p></header>
<main>
  <div class="program-page">
    <h1>Stepper</h1>
    <p class="description">Shows progress through a multi-step process (like checkout or onboarding), with completed, active, and upcoming steps.</p>
    <div class="output-box">
      <div class="stepper">
        <div class="step done"><div class="circle">✓</div><span>Account</span></div>
        <div class="step active"><div class="circle">2</div><span>Details</span></div>
        <div class="step"><div class="circle">3</div><span>Confirm</span></div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
