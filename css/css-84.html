<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset-password Form</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .form-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:26px; max-width:340px; }
  .form-card h2 { margin-top:0; text-align:center; }
  .form-card label { font-weight:600; display:block; margin:10px 0 4px; font-size:0.9rem; }
  .form-card input { width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:6px; }
  .form-card .btn { width:100%; margin-top:16px; }
  .form-card .link { text-align:center; margin-top:12px; font-size:0.85rem; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 84</h1><p>Reset-password Form</p></header>
<main>
  <div class="program-page">
    <h1>Set a New Password</h1>
    <p class="description">The form shown after clicking a reset link — collects and confirms a new password.</p>
    <div class="output-box">
      <div class="form-card">
        <h2>New Password</h2>
        <label>New Password</label><input type="password" placeholder="********">
        <label>Confirm Password</label><input type="password" placeholder="********">
        <button class="btn">Update Password</button>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
