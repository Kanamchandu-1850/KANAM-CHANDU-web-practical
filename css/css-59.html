<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Variants</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; }
  .btn-primary { background:#6366f1; color:#fff; border:none; padding:10px 18px; border-radius:8px; }
  .btn-secondary { background:#e5e7eb; color:#111827; border:none; padding:10px 18px; border-radius:8px; }
  .btn-outline { background:transparent; color:#6366f1; border:2px solid #6366f1; padding:8px 16px; border-radius:8px; }
  .btn-destructive { background:#dc2626; color:#fff; border:none; padding:10px 18px; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 59</h1><p>Primary, Secondary, Outline &amp; Destructive Buttons</p></header>
<main>
  <div class="program-page">
    <h1>Button Variants</h1>
    <p class="description">The four standard button styles used across most SaaS UIs, each signaling a different level of importance/risk.</p>
    <div class="output-box btn-row">
      <button class="btn-primary">Primary</button>
      <button class="btn-secondary">Secondary</button>
      <button class="btn-outline">Outline</button>
      <button class="btn-destructive">Delete</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
