<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Properties</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .bg-demo {
    height: 200px;
    background-image: url('https://placehold.co/100x100/2563eb/ffffff?text=BG');
    background-color: #eef2ff;
    background-position: center;
    background-size: 100px;
    background-repeat: repeat;
    border: 1px solid #d1d5db;
    border-radius: 8px;
  }
  .bg-fixed {
    height: 150px;
    background-image: url('https://placehold.co/600x150/1e293b/ffffff?text=Fixed+Background');
    background-attachment: fixed;
    background-size: cover;
    border-radius: 8px;
    margin-top: 14px;
  }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 5</h1><p>Background Images, Color, Position, Size, Repeat &amp; Attachment</p></header>
<main>
  <div class="program-page">
    <h1>Background Properties</h1>
    <p class="description">Demonstrates background-image, background-color, positioning, sizing, repeat, and fixed attachment.</p>
    <div class="output-box">
      <div class="bg-demo"></div>
      <div class="bg-fixed"></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
