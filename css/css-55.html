<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Feed Card</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .feed { max-width:320px; }
  .feed-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #f1f5f9; }
  .feed-item .dot { width:8px; height:8px; border-radius:50%; background:#6366f1; margin-top:6px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 55</h1><p>Activity Feed Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Activity Feed</h1>
    <p class="description">A vertical timeline-style feed showing a sequence of recent activity items.</p>
    <div class="output-box feed">
      <div class="feed-item"><div class="dot"></div><div>Priya uploaded a new file. <div style="color:#9ca3af; font-size:0.8rem;">10:24 AM</div></div></div>
      <div class="feed-item"><div class="dot"></div><div>Arun commented on Task #42. <div style="color:#9ca3af; font-size:0.8rem;">9:58 AM</div></div></div>
      <div class="feed-item"><div class="dot"></div><div>System backup completed. <div style="color:#9ca3af; font-size:0.8rem;">9:00 AM</div></div></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
