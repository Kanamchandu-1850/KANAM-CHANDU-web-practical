<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Bar Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .progress-track { width:100%; max-width:320px; height:12px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-bottom:14px; }
  .progress-fill { height:100%; background:#6366f1; border-radius:999px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 78</h1><p>Progress Bar Component</p></header>
<main>
  <div class="program-page">
    <h1>Progress Bars</h1>
    <p class="description">A horizontal bar showing completion percentage, common for uploads, onboarding, and storage usage.</p>
    <div class="output-box">
      <p>Upload: 70%</p>
      <div class="progress-track"><div class="progress-fill" style="width:70%;"></div></div>
      <p>Storage used: 35%</p>
      <div class="progress-track"><div class="progress-fill" style="width:35%; background:#16a34a;"></div></div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
