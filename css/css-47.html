<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .profile-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px; max-width:260px; text-align:center; }
  .profile-card img { width:80px; height:80px; border-radius:50%; margin-bottom:10px; }
  .profile-card .role { color:#6b7280; font-size:0.9rem; margin-bottom:12px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 47</h1><p>Profile Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Profile Card</h1>
    <p class="description">A user profile summary card with avatar, name, role, and an action button.</p>
    <div class="output-box">
      <div class="profile-card">
        <img src="https://placehold.co/80x80" alt="avatar">
        <h3 style="margin:4px 0;">Aditi Sharma</h3>
        <div class="role">Product Designer</div>
        <button class="btn">View Profile</button>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
