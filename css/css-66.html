<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Component</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .tooltip { position:relative; display:inline-block; border-bottom:1px dotted #6366f1; cursor:pointer; }
  .tooltip .tip { visibility:hidden; opacity:0; position:absolute; bottom:125%; left:50%; transform:translateX(-50%); background:#1f2937; color:#fff; padding:6px 10px; border-radius:6px; font-size:0.8rem; white-space:nowrap; transition:opacity 0.2s; }
  .tooltip:hover .tip { visibility:visible; opacity:1; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 66</h1><p>Tooltip Component</p></header>
<main>
  <div class="program-page">
    <h1>CSS-only Tooltip</h1>
    <p class="description">Hover the underlined text to reveal a small tooltip, built purely with :hover and positioning — no JavaScript.</p>
    <div class="output-box">
      <span class="tooltip">Hover me<span class="tip">This is a tooltip!</span></span>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
