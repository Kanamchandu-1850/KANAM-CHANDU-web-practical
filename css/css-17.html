<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Shadow and Text Shadow</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .shadow-box { width:180px; padding:20px; background:#fff; border-radius:10px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); margin-bottom:20px; }
  .shadow-text { font-size: 2rem; color:#fff; background:#1f2937; padding:14px; border-radius:8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); text-align:center; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 17</h1><p>box-shadow and text-shadow</p></header>
<main>
  <div class="program-page">
    <h1>Shadow Effects</h1>
    <p class="description">Demonstrates a soft drop shadow on a box, and a text shadow for depth on large text.</p>
    <div class="output-box">
      <div class="shadow-box">This card has a box-shadow.</div>
      <div class="shadow-text">Shadowed Text</div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
