<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonial Card</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .testimonial { background:#f8fafc; border-radius:12px; padding:22px; max-width:340px; }
  .testimonial .quote { font-style:italic; color:#374151; }
  .testimonial .person { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .testimonial img { width:40px; height:40px; border-radius:50%; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 56</h1><p>Testimonial Card Component</p></header>
<main>
  <div class="program-page">
    <h1>Testimonial Card</h1>
    <p class="description">A customer quote paired with their name and photo — common social proof on landing pages.</p>
    <div class="output-box">
      <div class="testimonial">
        <p class="quote">"This tool cut our onboarding time in half. Couldn't be happier."</p>
        <div class="person"><img src="https://placehold.co/40x40" alt="avatar"><div><strong>Rahul Mehta</strong><br><span style="color:#9ca3af; font-size:0.85rem;">CTO, Finlytics</span></div></div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
