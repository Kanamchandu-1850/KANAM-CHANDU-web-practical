<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .form-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:26px; max-width:380px; }
  .form-card label { font-weight:600; display:block; margin:10px 0 4px; font-size:0.9rem; }
  .form-card input, .form-card textarea { width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:6px; font-family:inherit; }
  .form-card .btn { width:100%; margin-top:16px; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 86</h1><p>Contact Form</p></header>
<main>
  <div class="program-page">
    <h1>Contact Us</h1>
    <p class="description">A typical "get in touch" form with name, email, and a message textarea.</p>
    <div class="output-box">
      <div class="form-card">
        <label>Name</label><input type="text">
        <label>Email</label><input type="email">
        <label>Message</label><textarea rows="4"></textarea>
        <button class="btn">Send Message</button>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
