<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropdown Navigation Menu</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .dropdown { position:relative; display:inline-block; }
  .dropdown > a { padding:10px 16px; background:#6366f1; color:#fff; text-decoration:none; border-radius:6px; display:inline-block; }
  .dropdown-content { display:none; position:absolute; background:#fff; border:1px solid #e5e7eb; border-radius:8px; min-width:160px; box-shadow:0 8px 16px rgba(0,0,0,0.1); z-index:1; }
  .dropdown-content a { display:block; padding:10px 14px; color:#374151; text-decoration:none; }
  .dropdown-content a:hover { background:#f3f4f6; }
  .dropdown:hover .dropdown-content { display:block; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 40</h1><p>Dropdown Navigation Menu</p></header>
<main>
  <div class="program-page">
    <h1>CSS-only Dropdown</h1>
    <p class="description">Hover over the button below — the dropdown appears using pure CSS (:hover), no JavaScript needed.</p>
    <div class="output-box">
      <div class="dropdown">
        <a href="#">Products ▾</a>
        <div class="dropdown-content">
          <a href="#">Analytics</a>
          <a href="#">Automation</a>
          <a href="#">Integrations</a>
        </div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
