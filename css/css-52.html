<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI and Metric Card</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .kpi-card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:18px; max-width:220px; }
  .kpi-card .trend-up { color:#16a34a; }
  .kpi-card .trend-down { color:#dc2626; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 52</h1><p>KPI and Metric Card Component</p></header>
<main>
  <div class="program-page">
    <h1>KPI Card</h1>
    <p class="description">A metric card that shows a value along with the change/trend since the last period.</p>
    <div class="output-box">
      <div class="kpi-card">
        <div style="color:#6b7280; font-size:0.9rem;">Revenue</div>
        <div style="font-size:1.6rem; font-weight:700;">$82,340</div>
        <div class="trend-up">▲ 12.4% vs last month</div>
      </div>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
