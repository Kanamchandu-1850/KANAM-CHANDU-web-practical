<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Buttons and Action Buttons</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .icon-row { display:flex; gap:10px; }
  .icon-btn { width:40px; height:40px; border-radius:50%; border:1px solid #e5e7eb; background:#fff; font-size:16px; cursor:pointer; }
  .icon-btn:hover { background:#f3f4f6; }
  .action-btn { display:inline-flex; align-items:center; gap:6px; background:#6366f1; color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<header class="site-header"><h1>CSS Program 60</h1><p>Icon Buttons and Action Buttons</p></header>
<main>
  <div class="program-page">
    <h1>Icon &amp; Action Buttons</h1>
    <p class="description">Round icon-only buttons for compact toolbars, and an icon+label action button.</p>
    <div class="output-box icon-row">
      <button class="icon-btn">✎</button>
      <button class="icon-btn">🗑</button>
      <button class="icon-btn">⭐</button>
      <button class="action-btn">➕ New Item</button>
    </div>
    <div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></div>
  </div>
</main>
</body>
</html>
